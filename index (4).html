<html lang="en">

<title>Momoka</title>
<meta name="description" content="Stay up to date on all platforms so you know what's going on in my life!">
<meta property="og:title" content="Momoka">
<meta property="og:description" content="Stay up to date on all platforms so you know what's going on in my life!">
<meta property="og:type" content="website">

<style>
  :root{
    --navy:    #4a1259;   /* deep plum */
    --ocean:   #a8329a;   /* magenta */
    --blue:    #c84bb0;   /* mid orchid */
    --aqua:    #e98fd6;   /* light pink-purple accent */
    --aqua-lt: #f4c2e8;
    --white:   #ffffff;
    --bg-top:  #fbeef8;
    --bg-bot:  #f3d6ee;
    --ink:     #4a1259;
    --ink-soft:#7c4d83;
    --ring:    rgba(74,18,89,.12);
    --shadow:  0 10px 30px rgba(74,18,89,.16);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{ margin:0; padding:0; }

  html{
    background:#fbeef8;
    overscroll-behavior:none;
  }

  body{
    font-family:"Inter", system-ui, -apple-system, sans-serif;
    color:var(--ink);
    min-height:100vh;
    background:
      radial-gradient(120% 60% at 50% -10%, var(--aqua-lt) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
    background-attachment:fixed;
    display:flex;
    justify-content:center;
    padding:0 0 calc(40px + env(safe-area-inset-bottom));
  }

  .shell{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .content{
    width:100%;
    box-sizing:border-box;
    padding:0 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- HERO PHOTO (full-bleed, edge to edge) ---------- */
  .hero{
    position:relative;
    width:100%;
    aspect-ratio:4/5;
    overflow:hidden;
    background:
      linear-gradient(160deg, var(--aqua) 0%, var(--ocean) 55%, var(--navy) 100%);
  }
  .hero img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .hero .shine{
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 55%, rgba(11,42,74,.35) 100%);
    pointer-events:none;
  }

  /* ---------- NAME ---------- */
  .name{
    margin:26px 0 0;
    font-family:"Poppins", sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:-.01em;
    display:flex; align-items:center; gap:8px;
    color:var(--navy);
  }
  .verified{ width:22px; height:22px; flex:none; }
  .tagline{
    margin:8px 4px 0;
    text-align:center;
    font-size:14.5px;
    line-height:1.5;
    color:var(--ink-soft);
    max-width:300px;
  }

  /* ---------- SMALL ICON ROW ---------- */
  .mini-row{
    display:flex;
    gap:14px;
    margin:20px 0 6px;
  }
  .mini{
    width:46px; height:46px;
    border-radius:50%;
    display:grid; place-items:center;
    background:var(--white);
    border:1px solid var(--ring);
    box-shadow:0 4px 12px rgba(11,42,74,.10);
    color:var(--ocean);
    text-decoration:none;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .mini svg{ width:21px; height:21px; }
  .mini:active{ transform:scale(.92); }
  @media (hover:hover){
    .mini:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(168,50,154,.26); }
  }

  /* ---------- BIG BUTTONS ---------- */
  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-top:18px;
  }
  .btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:17px 20px;
    border-radius:18px;
    text-decoration:none;
    font-family:"Poppins", sans-serif;
    font-weight:600;
    font-size:16px;
    background:var(--white);
    color:var(--navy);
    border:1px solid var(--ring);
    box-shadow:0 6px 16px rgba(11,42,74,.08);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn .ic{ width:24px; height:24px; flex:none; color:var(--ocean); }
  .btn .chev{ margin-left:auto; width:18px; height:18px; color:var(--ink-soft); opacity:.55; }
  .btn:active{ transform:scale(.985); }
  @media (hover:hover){
    .btn:hover{ transform:translateY(-2px); box-shadow:0 12px 26px rgba(168,50,154,.24); }
  }
  .btn.primary{
    background:linear-gradient(135deg, var(--aqua) 0%, var(--ocean) 55%, var(--navy) 100%);
    color:#fff;
    border:none;
    box-shadow:0 10px 24px rgba(168,50,154,.42);
  }
  .btn.primary .ic{ color:#fff; }
  .btn.primary .chev{ color:#fff; opacity:.85; }

  /* ---------- FOOTER ---------- */
  .foot{
    margin-top:28px;
    font-size:12px;
    color:var(--ink-soft);
    opacity:.7;
    letter-spacing:.02em;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }

  @media (min-width:460px){
    .shell{ margin-top:26px; }
    .hero{ border-radius:24px; box-shadow:var(--shadow); }
  }
</style>
</head>
